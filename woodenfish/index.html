<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>敲木鱼祈福 · 支持</title><style>body{max-width:720px;margin:64px auto;padding:24px;font:17px/1.9 system-ui;background:#101612;color:#e5dfce}h1,h2{color:#c9a668}a{color:#c9a668}</style><h1>敲木鱼祈福</h1><p>一念一声，让心慢下来。</p><h2>敲击与节奏</h2><p>轻触木鱼手动计数；点击“自动敲击”开始或暂停。右上角可调整节奏、定时、音色、触感与背景伴音。离开页面或进入后台时，自动敲击会暂停。</p><h2>祈愿与记录</h2><p>在“祈愿”页写下祝福，或用系统分享面板发送给在意的人。“记录”页展示本机敲击统计，并可导出 JSON 文件。</p><h2>常见问题</h2><p>没有声音：检查系统音量与静音开关，并在设置中开启木鱼声音。触感反馈取决于设备硬件支持。记录保存在本机，卸载前请先导出需要保留的内容。</p><p>应用用于休闲与静心体验，不提供医疗建议。</p><p><a href="privacy.html">隐私政策 / Privacy policy</a> · <a href="https://github.com/wanwanyahoo/HappyDogGame/issues">反馈问题 / Support</a></p></html>
